name: Publicar Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar Windows
        run: npm run dist:win

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ikiway POS Printer ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Ikiway-POS-Printer-Setup-*-x64.exe
            dist/Ikiway-POS-Printer-Setup-*-x64.exe.blockmap
            dist/Ikiway-POS-Printer-Portable-*-x64.exe
            dist/latest.yml
